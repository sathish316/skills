<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css">
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #5d6b7a;
      --line: #d8dee6;
      --accent: #1f6feb;
      --accent-soft: #e8f1ff;
      --changed: #fff6d6;
      --new: #e7f8ee;
      --removed: #ffe8e8;
      --code: #0f1720;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    main {
      width: min(1120px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    header {
      border-bottom: 1px solid var(--line);
      padding: 8px 0 20px;
      margin-bottom: 20px;
    }

    h1, h2, h3 {
      line-height: 1.15;
      letter-spacing: 0;
      margin: 0;
    }

    h1 {
      font-size: clamp(28px, 4vw, 44px);
      max-width: 980px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    h3 {
      font-size: 16px;
      margin: 18px 0 8px;
    }

    p {
      margin: 0 0 10px;
    }

    a {
      color: var(--accent);
    }

    section {
      margin-top: 18px;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .summary {
      max-width: 880px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 17px;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin: 18px 0 0;
    }

    .meta div,
    .callout,
    .delta-card {
      background: var(--accent-soft);
      border: 1px solid #c9ddff;
      border-radius: 8px;
      padding: 10px 12px;
    }

    .meta dt {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .meta dd {
      margin: 3px 0 0;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .delta-card h3 {
      margin-top: 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eef2f7;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .tag.new {
      background: var(--new);
      color: #146c3c;
    }

    .tag.changed {
      background: var(--changed);
      color: #755600;
    }

    .tag.removed {
      background: var(--removed);
      color: #9b1c1c;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      overflow-wrap: anywhere;
    }

    th, td {
      border: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f1f4f8;
      font-size: 12px;
      text-transform: uppercase;
    }

    pre {
      margin: 12px 0 0;
      padding: 14px;
      overflow: auto;
      border-radius: 8px;
      background: var(--code);
      color: #e6edf3;
      font-size: 13px;
      line-height: 1.45;
    }

    pre[class*="language-"] {
      margin: 12px 0 0;
      border-radius: 8px;
      background: var(--code);
      font-size: 13px;
      line-height: 1.45;
    }

    code[class*="language-"] {
      font-size: 13px;
      line-height: 1.45;
      white-space: pre;
    }

    pre.mermaid {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--line);
    }

    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: .92em;
    }

    ul {
      padding-left: 20px;
      margin: 8px 0 0;
    }

    @media (max-width: 720px) {
      main {
        width: min(100vw - 24px, 1120px);
        padding-top: 20px;
      }

      section {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">PR Walkthrough</p>
      <h1>{{TITLE}}</h1>
      <p class="summary">{{SUMMARY}}</p>
      <dl class="meta">
        {{META}}
      </dl>
    </header>

    {{CONTENT}}
  </main>

  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    mermaid.initialize({
      startOnLoad: true,
      theme: "base",
      themeVariables: {
        fontFamily: "Inter, ui-sans-serif, system-ui, sans-serif",
        primaryColor: "#e8f1ff",
        primaryBorderColor: "#1f6feb",
        primaryTextColor: "#17202a",
        lineColor: "#5d6b7a"
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/plugins/autoloader/prism-autoloader.min.js"></script>
  <script>
    Prism.plugins.autoloader.languages_path = "https://cdn.jsdelivr.net/npm/prismjs@1/components/";
  </script>
</body>
</html>
